# Salt Minion Configuration for Istio VM Setup
# This file should be placed at /etc/salt/minion on each VM

# Master configuration - point to your Salt master server
# For masterless mode, comment out this section
#master: salt-master.your-domain.com

# Masterless mode configuration (recommended for VM images)
file_client: local
local: true

# Minion ID configuration
id: {{ grains.id }}

# File and pillar roots for masterless operation
file_roots:
  base:
    - /srv/salt

pillar_roots:
  base:
    - /srv/pillar

# Grains configuration - static information about the minion
grains:
  environment: production  # Change this per environment
  role: istio-vm
  cloud_provider: azure
  
# Startup states - automatically run states on minion start
startup_states: sls
sls_list:
  - boot-time

# Logging configuration
log_level: info
log_file: /var/log/salt/minion

# Performance and reliability settings
loop_interval: 60
auth_timeout: 60
auth_tries: 7
ping_interval: 0

# Cache settings
cache_jobs: true
grains_cache: true
grains_cache_expiration: 300

# Module and state configuration
modules_max_memory: -1
state_aggregate: true
state_verbose: false

# Backup configuration
backup_mode: minion

# Process management
multiprocessing: true